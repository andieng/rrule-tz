name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines declares node >=18, so every supported major is exercised. The timezone axis is
        # the point of this package - a cached or mis-resolved host zone has broken the core
        # guarantee twice in review, and both times only a non-UTC host would have caught it.
        # Kiritimati (+14) and Kathmandu (+05:45) cover the extreme and fractional offsets.
        node-version: [18, 20, 22]
        tz: [UTC, America/New_York, Pacific/Kiritimati, Asia/Kathmandu]
    env:
      TZ: ${{ matrix.tz }}
    name: node ${{ matrix.node-version }} / TZ ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
